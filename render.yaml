services:
  - type: web
    name: firestorm-terratrend-platform
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib_cache
